<div
  class="pricing-card"
  [class.hoverable]="hoverable"
  [class.shadow]="shadow"
  [style.background]="cardBackground"
  [style.border-color]="borderColor"
  [style.border-radius.px]="borderRadius"
>

  <!-- Badge -->
  @if (plan.badge) {
    <div
      class="pricing-badge"
      [style.background]="badgeColor">

      {{ plan.badge }}

    </div>
  }

  <!-- Header -->
  <div class="pricing-header">

    <h3 class="pricing-title">
      {{ plan.title }}
    </h3>

    <p class="pricing-description">
      {{ plan.description }}
    </p>

  </div>

  <!-- Price -->
  <div class="pricing-price">

    <span class="price">

      {{ plan.price }}

    </span>

    @if (plan.duration) {

      <span class="duration">

        {{ plan.duration }}

      </span>

    }

  </div>

  <!-- Button -->
  <button type="button"
    class="pricing-button"
    (click)="selectPlan()"
    [class.filled]="buttonVariant === 'filled'"
    [class.outline]="buttonVariant === 'outline'">

    {{ plan.buttonText }}

  </button>

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Features -->
  <ul class="feature-list">

    @for (feature of plan.features; track feature) {

      <li class="feature-item">

        <lucide-icon
          class="feature-icon"
          [img]="featureIcon"
          [size]="18">
        </lucide-icon>

        <span>
          {{ feature }}
        </span>

      </li>

    }

  </ul>

</div>

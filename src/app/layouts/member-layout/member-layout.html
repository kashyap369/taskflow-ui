<div class="portal-layout">
  <header class="portal-topbar">
    <a class="brand" routerLink="/member/dashboard">
      <span class="brand-logo">
        <img src="/taskflow-mark.svg" alt="" width="38" height="38" />
      </span>
      <span class="brand-name">TaskFlow</span>
      <span class="portal-tag">Personal</span>
    </a>

    <nav class="portal-nav">
      <a routerLink="/member/dashboard" routerLinkActive="active">
        <lucide-angular name="LayoutDashboard" [size]="16"></lucide-angular>
        <span>Dashboard</span>
      </a>
      <a routerLink="/member/my-tasks" routerLinkActive="active">
        <lucide-angular name="ListChecks" [size]="16"></lucide-angular>
        <span>My tasks</span>
      </a>
      <a routerLink="/member/projects" routerLinkActive="active">
        <lucide-angular name="FolderKanban" [size]="16"></lucide-angular>
        <span>Projects</span>
      </a>
      @if (plannerEnabled) {
        <a routerLink="/member/planner" routerLinkActive="active">
          <lucide-angular name="PenTool" [size]="16"></lucide-angular>
          <span>Planner</span>
        </a>
      }
      @if (hasOrganizations()) {
        <a routerLink="/organization/dashboard">
          <lucide-angular name="Building2" [size]="16"></lucide-angular>
          <span>Workspaces</span>
        </a>
      }
      <a routerLink="/member/invitations" routerLinkActive="active">
        <lucide-angular name="Mail" [size]="16"></lucide-angular>
        <span>Invitations</span>
        @if (pendingInvitations() > 0) {
          <span class="nav-badge" [attr.aria-label]="pendingInvitations() + ' pending invitations'">
            {{ pendingInvitations() }}
          </span>
        }
      </a>
    </nav>

    <div class="topbar-actions">
      <button
        type="button"
        class="icon-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (isDark()) {
          <lucide-angular name="Sun" [size]="18"></lucide-angular>
        } @else {
          <lucide-angular name="Moon" [size]="18"></lucide-angular>
        }
      </button>

      @if (user(); as u) {
        <div class="user-chip">
          <span class="user-avatar">{{ u.fullName.charAt(0) }}</span>
          <span class="user-name">{{ u.fullName }}</span>
        </div>
      }

      <button type="button" class="logout-btn" (click)="logout()">
        <lucide-angular name="LogOut" [size]="16"></lucide-angular>
        <span class="d-none d-sm-inline">Sign out</span>
      </button>
    </div>
  </header>

  <main class="portal-content">
    <router-outlet />
  </main>
</div>

<header class="public-header">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/">
        <span class="logo">
          <img src="taskflow-mark.svg" alt="" width="40" height="40" />
        </span>
        <span class="brand-name">TaskFlow</span>
      </a>

      <div class="header-actions order-lg-last">
        <!-- Theme toggle -->
        <button
          type="button"
          class="theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (isDark()) {
            <lucide-angular name="Sun" [size]="18"></lucide-angular>
          } @else {
            <lucide-angular name="Moon" [size]="18"></lucide-angular>
          }
        </button>

        <a routerLink="/auth/login" class="signin d-none d-lg-inline">Sign in</a>

        <a routerLink="/auth/register" class="get-started">
          Get started
          <lucide-angular name="ArrowRight" [size]="16"></lucide-angular>
        </a>

        <!-- Mobile toggle -->
        <button
          class="navbar-toggler"
          type="button"
          (click)="toggleMenu()"
          [class.is-open]="menuOpen()"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="navbarMenu"
          [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <!-- Menu -->
      <div class="navbar-collapse" id="navbarMenu" [class.is-open]="menuOpen()">
        <ul class="navbar-nav mx-auto">
          @for (link of navLinks; track link.fragment) {
            <li class="nav-item">
              <a
                class="nav-link"
                [attr.href]="'/#' + link.fragment"
                (click)="closeMenu()"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>

        <a routerLink="/auth/login" class="signin d-lg-none" (click)="closeMenu()">Sign in</a>
      </div>
    </div>
  </nav>
</header>

<header class="public-header">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/">
        <span class="logo">
          <lucide-angular name="Sparkles" [size]="18"></lucide-angular>
        </span>
        <span class="brand-name">TaskFlow</span>
      </a>

      <div class="header-actions order-lg-last">
        <!-- Theme toggle -->
        <button
          type="button"
          class="theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          @if (isDark()) {
            <lucide-angular name="Sun" [size]="18"></lucide-angular>
          } @else {
            <lucide-angular name="Moon" [size]="18"></lucide-angular>
          }
        </button>

        <a routerLink="/auth/login" class="signin d-none d-lg-inline">Sign in</a>

        <a routerLink="/auth/register" class="get-started">
          Get started
          <lucide-angular name="ArrowRight" [size]="16"></lucide-angular>
        </a>

        <!-- Mobile toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
          aria-label="Toggle navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <!-- Menu -->
      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav mx-auto">
          @for (link of navLinks; track link.fragment) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="['/']" [fragment]="link.fragment">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>

        <a routerLink="/auth/login" class="signin d-lg-none">Sign in</a>
      </div>
    </div>
  </nav>
</header>

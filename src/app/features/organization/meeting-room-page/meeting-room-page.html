<section class="room-page"><header><a [routerLink]="['/organization/meetings', id]">Leave room</a><span [class.reconnecting]="room.connectionState() === 'reconnecting'">{{ room.connectionState() === 'reconnecting' ? 'Reconnecting…' : 'Live' }}</span></header>
  @if (error()) { <div class="room-error" role="alert"><p>{{ error() }}</p><button type="button" class="btn btn--primary" (click)="requestToken()">Try again</button></div> }
  @else { <main><div #media class="media-grid" aria-label="Live meeting media"></div>@if (joining()) { <div class="joining">Joining secure room…</div> }</main>
    <footer><span>{{ room.participantCount() }} in the room</span><div class="controls"><button type="button" [attr.aria-label]="room.microphoneEnabled() ? 'Mute microphone' : 'Turn on microphone'" (click)="toggleMic()"><lucide-angular [name]="room.microphoneEnabled() ? 'Mic' : 'MicOff'" size="20" /></button><button type="button" [attr.aria-label]="room.cameraEnabled() ? 'Turn off camera' : 'Turn on camera'" (click)="toggleCamera()"><lucide-angular [name]="room.cameraEnabled() ? 'Video' : 'VideoOff'" size="20" /></button>@if (token()?.canShareScreen) { <button type="button" aria-label="Share screen" [class.active]="room.screenShareEnabled()" (click)="toggleShare()"><lucide-angular name="MonitorUp" size="20" /></button> }<button type="button" class="leave" aria-label="Leave room" (click)="leave()"><lucide-angular name="PhoneOff" size="20" /></button></div></footer> }
</section>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TaskFlow — The premium workspace where great teams ship</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="TaskFlow brings projects, tasks, calendars and team collaboration into one beautifully designed, enterprise-grade workspace.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#7c3aed">

  <!-- Set theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('taskflow-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Typefaces — see docs/DESIGN-PHASES.md "Typeface decision".
       Satoshi (display/headings/UI) · Switzer (body/UI text) · IBM Plex Mono (metrics, tabular numerals).
       Satoshi is served from Fontshare; self-hosting the woff2 under assets/fonts/satoshi/ is the
       eventual goal (removes a third-party render-blocking request) but is deferred. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link
    href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@500,600,700,800,900&f%5B%5D=switzer@400,500,600,700&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TaskFlow — The premium workspace where great teams ship</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="TaskFlow brings projects, tasks, calendars and team collaboration into one beautifully designed, enterprise-grade workspace.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Set theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('taskflow-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Typeface: Plus Jakarta Sans (display/UI) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
